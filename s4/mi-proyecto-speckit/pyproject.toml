[project]
name = "conversor-temperatura"
version = "0.1.0"
description = "Conversor de temperatura entre Celsius, Fahrenheit y Kelvin con Tkinter y CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
conversor = "conversor.gui:main"
conversor-cli = "conversor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conversor"]
